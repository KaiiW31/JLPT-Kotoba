plugins {
    id "com.android.application"
}

android {
    namespace "com.kai.jlptkotoba"
    compileSdk 36

    defaultConfig {
        applicationId "com.kai.jlptkotoba"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "1.3.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
